<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="MD. Asif Ahmed — Mobile Application Developer and Flutter Developer with 3+ years of professional experience building production Android and iOS applications."
  >

  <meta name="theme-color" content="#030712">

  <meta name="mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="MD. Asif Ahmed"
  >

  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="favicon.png"
  >

  <title>MD. Asif Ahmed | Flutter Developer</title>

  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #030712;
    }

    body {
      overflow: hidden;
    }

    #portfolio-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 72% 24%,
          rgba(101, 73, 184, 0.22),
          transparent 36%
        ),
        radial-gradient(
          circle at 20% 78%,
          rgba(88, 116, 232, 0.20),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          #071020 0%,
          #030712 52%,
          #050815 100%
        );
      opacity: 1;
      visibility: visible;
      transition:
        opacity 420ms ease,
        visibility 420ms ease;
    }

    #portfolio-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      width: min(88vw, 360px);
      text-align: center;
      color: #f4f6fb;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .loader-mark {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top-color: #5874e8;
      border-right-color: #6549b8;
      animation: loader-spin 1.2s linear infinite;
      box-shadow:
        0 0 28px rgba(88, 116, 232, 0.18),
        inset 0 0 18px rgba(101, 73, 184, 0.08);
    }

    .loader-avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    }

    .loader-eyebrow {
      margin-bottom: 9px;
      color: #8068d8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .loader-name {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.6px;
    }

    .loader-role {
      margin-top: 9px;
      color: #b7c0d0;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
    }

    .loader-progress {
      position: relative;
      width: 180px;
      height: 2px;
      margin: 24px auto 0;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .loader-progress::after {
      content: "";
      position: absolute;
      top: 0;
      left: -45%;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        #5874e8,
        #6549b8
      );
      animation: loader-progress 1.35s ease-in-out infinite;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes loader-progress {
      0% {
        left: -45%;
      }

      100% {
        left: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-ring,
      .loader-progress::after {
        animation: none;
      }

      #portfolio-loader {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div
    id="portfolio-loader"
    role="status"
    aria-live="polite"
    aria-label="Loading portfolio"
  >
    <div class="loader-content">
      <div class="loader-mark">
        <div class="loader-ring"></div>

        <img
          class="loader-avatar"
          src="icons/Icon-192.png"
          alt=""
        >
      </div>

      <div class="loader-eyebrow">
        Portfolio
      </div>

      <h1 class="loader-name">
        MD. Asif Ahmed
      </h1>

      <div class="loader-role">
        Mobile Application Developer • Flutter Developer
      </div>

      <div class="loader-progress"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
